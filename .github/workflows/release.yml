name: Release

on:
    push:
        branches: ["master"]

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            issues: write
            pull-requests: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm

            - run: npm ci
            - run: npm run typecheck
            - run: npm test

            - name: Verify release tokens
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: |
                  set -e

                  if [ -z "$NPM_TOKEN" ]; then
                    echo "::error::NPM_TOKEN secret is missing"
                    exit 1
                  fi

                  if [ -z "$GH_TOKEN" ]; then
                    echo "::error::GH_TOKEN secret is missing"
                    exit 1
                  fi

                  npm_status=$(curl -sS -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $NPM_TOKEN" \
                    https://registry.npmjs.org/-/whoami)

                  if [ "$npm_status" != "200" ]; then
                    echo "::error::NPM_TOKEN is invalid (HTTP $npm_status)"
                    exit 1
                  fi

                  gh_status=$(curl -sS -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    https://api.github.com/user)

                  if [ "$gh_status" != "200" ]; then
                    echo "::error::GH_TOKEN is invalid (HTTP $gh_status)"
                    exit 1
                  fi

            - name: Release
              run: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  GIT_AUTHOR_NAME: semantic-release-bot
                  GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
                  GIT_COMMITTER_NAME: semantic-release-bot
                  GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
